<!doctype html>
<html lang="en" data-default-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ray Trace Doctor: find where your Ray job lost time</title>
    <meta name="description" content="Upload a saved ray timeline trace and see where your job lost time: idle GPUs, starved stages, stragglers, tiny tasks. Runs entirely in your browser, even after the cluster is gone." />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script>
      ;(function () {
        var q = new URLSearchParams(location.search).get('mode')
        var m = q === 'light' || q === 'dark' ? q : localStorage.getItem('themeMode')
        document.documentElement.dataset.themeMode = m === 'light' || m === 'dark' ? m : document.documentElement.dataset.defaultMode
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
